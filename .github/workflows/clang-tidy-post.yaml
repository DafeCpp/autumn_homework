name: clang-tidy-post

on:
  workflow_run:
    workflows: ['clang-tidy-review']
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

# Serialize attempts for the same commit to avoid concurrent duplicate reviews.
concurrency:
  group: clang-tidy-post-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # github.sha is the default-branch commit for workflow_run, never PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Publish advisory review
        uses: actions/github-script@v7
        with:
          script: |
            const post = require('./.github/scripts/clang-tidy-post.cjs');
            await post({github, context, core});
