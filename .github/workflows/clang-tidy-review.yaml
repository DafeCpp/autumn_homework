name: clang-tidy-review

on: [pull_request]

permissions:
  contents: read
  pull-requests: read

env:
  TIDY_CHECKS: >-
    -*,performance-*,bugprone-*,clang-analyzer-*,cppcoreguidelines-*,mpi-*,misc-*,
    -cppcoreguidelines-avoid-non-const-global-variables,-cppcoreguidelines-avoid-magic-numbers,
    -clang-diagnostic-error,-misc-no-recursion,-cppcoreguidelines-owning-memory,
    -bugprone-narrowing-conversions,-bugprone-easily-swappable-parameters,
    -misc-non-private-member-variables-in-classes,-cppcoreguidelines-pro-bounds-pointer-arithmetic,
    -cppcoreguidelines-special-member-functions,-cppcoreguidelines-init-variables,-misc-include-cleaner,
    -cppcoreguidelines-narrowing-conversions,-misc-const-*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure compilation database
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev clang-tidy-19
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Test review publisher and analysis guard
        run: |
          node --test .github/scripts/clang-tidy-post.test.cjs
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # cpp-linter 1.13.0 ignores clang-tidy's return code. Check it explicitly,
      # without line filters, so errors outside the diff cannot disappear.
      - name: Check analysis can complete
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/clang-tidy-preflight.py

      - name: Analyze changed lines
        id: lint
        uses: cpp-linter/cpp-linter-action@v2.21.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: '19'
          database: build
          style: ''
          tidy-checks: ${{ env.TIDY_CHECKS }}
          lines-changed-only: true
          files-changed-only: true
          file-annotations: true
          step-summary: true
          tidy-review: false
          format-review: false
          thread-comments: false
          summary-output-file: build/clang-tidy-report.md

      - name: Save full report
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/clang-tidy-report.md
          if-no-files-found: error
