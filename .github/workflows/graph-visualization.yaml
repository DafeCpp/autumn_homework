name: graph-visualization
on:
  pull_request:
    paths:
      - 'tools/graph_viewer/**'
      - 'visualize'
      - 'lib/src/graph_trace.*'
      - 'examples/bfs_visualization/**'
      - 'scripts/run_cases.py'
      - '.devcontainer/**'
      - 'CMakeLists.txt'
      - '.github/workflows/graph-visualization.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/graph_viewer/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: npm --prefix tools/graph_viewer ci
      - run: npm --prefix tools/graph_viewer run typecheck
      - run: npm --prefix tools/graph_viewer test
      - run: ./visualize --prepare-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bfs-traces
          path: .graph-traces/bfs_visualization/*.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
